services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: money_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/money_dev
      PORT: 3000
      # Test-mode keys, read from your shell or .env; never hard-code them here.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:-local_mock_bank_secret}
      # Reconciliation reads the bank's statement from here.
      BANK_API_URL: http://mock-bank:4000
      # The admin API and dashboard (http://localhost:3000/dashboard/). Change it for anything but local demos.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token}
      # The user wallet (http://localhost:3000/wallet/): signs demo sign-in tokens.
      WALLET_SESSION_SECRET: ${WALLET_SESSION_SECRET:-local-wallet-secret}
      # Local demos only: deposits use the demo checkout page when no
      # STRIPE_SECRET_KEY is set, and the wallet shows the mock bank's switches.
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Publishes outbox events. Scale it (`docker compose up --scale worker=3`):
  # copies coordinate through Postgres, so each event is claimed by one at a time.
  worker:
    build: .
    command: ["npx", "tsx", "src/outbox/run.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/money_dev
      # Where to POST events. Unset: events are written to the worker's stdout.
      OUTBOX_WEBHOOK_URL: ${OUTBOX_WEBHOOK_URL:-}
      # Sends payouts to the mock bank and reconciles quiet ones.
      BANK_API_URL: http://mock-bank:4000
    depends_on:
      db:
        condition: service_healthy

  # A fake external bank: its own state, delayed settlement, webhooks back to
  # the API. Make it misbehave through POST localhost:4000/_admin/behaviour.
  mock-bank:
    build: .
    command: ["npx", "tsx", "src/bank/run.ts"]
    environment:
      BANK_PORT: 4000
      BANK_WEBHOOK_URL: http://api:3000/webhooks/bank
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:-local_mock_bank_secret}
    ports:
      - "4000:4000"

  # Seeds Alice, Bob and Carol with a history once the API is up, then exits.
  # Safe to run again: it uses fixed idempotency keys, so a re-run changes nothing.
  seed:
    build: .
    command: ["npx", "tsx", "scripts/demo-seed.ts"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/money_dev
      API_URL: http://api:3000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      mock-bank:
        condition: service_started

volumes:
  pgdata:
